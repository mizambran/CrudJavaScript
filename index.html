<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Registro Facturas de Compra</title>
  </head>
  <body class="container">
    <h3>Registración de Facturas de compras</h3>
    <div class="containerFormFacturas col-lg-4">
      <button
        class="btn btn-primary"
        onclick="ingresarFactura()"
        id="buttonIngresarFactura"
      >
        Ingresar
      </button>
      <form
        class="form-control d-flex flex-column d-none"
        id="formIngresarFactura"
      >
        <label for="cuit">CUIT</label>
        <input type="text" id="cuit" />
        <label for="proveedor">Proveedor</label>
        <input type="text" id="proveedor"/>
        <label for="fechaEmision">Emisión</label>
        <input type="text" id="fechaEmision"/>
        <label for="numeroComprobante">N° Comprobante</label>
        <input type="text" id="numeroComprobante"/>
        <label for="importeNeto">Neto</label>
        <input type="text" id="importeNeto"/>
        <label for="importeIva">IVA</label>
        <input type="text" id="importeIva"/>
        <label for="importeTotal">Total</label>
        <input type="text" id="importeTotal"/>

        <div class="accionesForm">
          <button type="submit" class="btn btn-primary" id="registrarFactura">Registrar</button>
          <button class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
    <div class="container mt-5 containerFacturas col-lg-4">

    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </body>
</html>
